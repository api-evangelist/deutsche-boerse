openapi: 3.2.0
info:
  title: A7 Analytics Platform - Option Analytics Symbols API
  description: A7 Analytics Platform for the main T7 trading venues of Deutsche Börse Group.
  contact:
    name: Deutsche Börse Data & Analytics
    url: https://www.mds.deutsche-boerse.com
    email: analytics@deutsche-boerse.com
  version: 1.0.1
servers:
- url: /api/v1
  description: A7 production environment
security:
- bearerAuth: []
tags:
- name: Symbols
paths:
  /aidataset/OPT/:
    get:
      tags:
      - Symbols
      summary: gets symbols for live options prices
      description: gets unique trading symbol identifiers for live options prices
      operationId: getOPTsym
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/symbols'
            application/gzip:
              schema:
                $ref: '#/components/schemas/symbols'
                format: binary
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
  /aidataset/IV/:
    get:
      tags:
      - Symbols
      summary: gets symbols for implied volatility
      description: gets unique trading symbol identifiers for implied volatility
      operationId: getIVsym
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/symbols'
            application/gzip:
              schema:
                $ref: '#/components/schemas/symbols'
                format: binary
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
  /aidataset/RV/:
    get:
      tags:
      - Symbols
      summary: gets symbols for realized volatility
      description: gets unique trading symbol identifiers for realized volatility
      operationId: getRVsym
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/symbols'
            application/gzip:
              schema:
                $ref: '#/components/schemas/symbols'
                format: binary
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
  /aidataset/DIV/:
    get:
      tags:
      - Symbols
      summary: gets symbols for implied dividend flow
      description: gets unique trading symbol identifiers for implied dividend flow
      operationId: getDIVsym
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/symbols'
            application/gzip:
              schema:
                $ref: '#/components/schemas/symbols'
                format: binary
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
  /aidataset/SMI/:
    get:
      tags:
      - Symbols
      summary: gets symbols for smile
      description: gets unique trading symbol identifiers for smile
      operationId: getSMIsym
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/symbols'
            application/gzip:
              schema:
                $ref: '#/components/schemas/symbols'
                format: binary
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
  /aidataset/FWD/:
    get:
      tags:
      - Symbols
      summary: gets symbols for forward
      description: gets unique trading symbol identifiers for forward
      operationId: getFWDsym
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/symbols'
            application/gzip:
              schema:
                $ref: '#/components/schemas/symbols'
                format: binary
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
components:
  responses:
    '404':
      description: not found
    '403':
      description: access denied
      content:
        text/plain:
          schema:
            type: string
          example: specific error message
    '400':
      description: bad request
      content:
        text/plain:
          schema:
            type: string
          example: specific error message
    '401':
      description: authorization failed
      content:
        text/plain:
          schema:
            type: string
          example: specific error message
  schemas:
    symbols:
      description: array of trading symbols
      type: array
      items:
        $ref: '#/components/schemas/symbol'
      example:
      - DB1
      - DPW
      - DTE
    symbol:
      description: trading symbol
      type: string
      enum:
      - OESX
      - ODAX
      - OSMI
      - OESB
      - OVS2
      - ITK
      - ABBN
      - ASM
      - ADS
      - AIR
      - EAD
      - ALV
      - AXA
      - BAS
      - BBVD
      - BMW
      - BNP
      - BAY
      - DBK
      - DB1
      - DPW
      - DTE
      - EOA
      - ENL5
      - INN
      - IBE
      - IFX
      - IES5
      - PPX
      - LOR
      - MOH
      - LIN
      - DAI
      - MUV2
      - NESN
      - NOVN
      - PHI1
      - REP
      - ROG
      - SAP
      - SNW
      - BSD2
      - SND
      - SIE
      - SGE
      - SREN
      - TNE5
      - TOTB
      - UBSN
      - CRI5
      - SQU
      - VO3
      - ANN
      - ZURN
      example: DB1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
