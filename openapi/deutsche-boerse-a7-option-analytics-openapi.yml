components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    symbol:
      name: symbol
      in: path
      description: unique trading symbol identifier
      required: true
      schema:
        $ref: '#/components/schemas/symbol'
    maturity:
      name: maturity
      in: path
      description: option maturity
      required: true
      schema:
        $ref: '#/components/schemas/maturity'
    indicator:
      name: indicator
      in: path
      description: indicator name
      required: true
      schema:
        $ref: '#/components/schemas/indicator'
    longmaturity:
      name: longmaturity
      in: path
      description: option maturity (long pattern)
      required: true
      schema:
        $ref: '#/components/schemas/longmaturity'
  schemas:
    dataset:
      description: dataset name
      type: string
      enum:
        - OPT
        - IV
        - RV
        - DIV
        - SMI
        - FWD
      example: OPT
    datasets:
      description: array of dataset names
      type: array
      items:
        $ref: '#/components/schemas/dataset'
      example: [OPT,IV,RV]
    datasetdescs:
      description: dictionary of datasets
      type: object
      additionalProperties:
        description: dataset description
        type: string
      example:
        OPT: Live options prices,
        IV: Implied volatility,
        RV: Realized volatility (intraday, maturity expressed as EWM, span in business days)
    symbol:
      description: trading symbol
      type: string
      enum:
        - OESX
        - ODAX
        - OSMI
        - OESB
        - OVS2
        - ITK
        - ABBN
        - ASM
        - ADS
        - AIR
        - EAD
        - ALV
        - AXA
        - BAS
        - BBVD
        - BMW
        - BNP
        - BAY
        - DBK
        - DB1
        - DPW
        - DTE
        - EOA
        - ENL5
        - INN
        - IBE
        - IFX
        - IES5
        - PPX
        - LOR
        - MOH
        - LIN
        - DAI
        - MUV2
        - NESN
        - NOVN
        - PHI1
        - REP
        - ROG
        - SAP
        - SNW
        - BSD2
        - SND
        - SIE
        - SGE
        - SREN
        - TNE5
        - TOTB
        - UBSN
        - CRI5
        - SQU
        - VO3
        - ANN
        - ZURN
      example: DB1
    maturity:
      description: option maturity
      type: string
      pattern: '^[01][0-9]{3}$'
      example: '0625'
    symbols:
      description: array of trading symbols
      type: array
      items:
        $ref: '#/components/schemas/symbol'
      example: [DB1,DPW,DTE]
    prices:
      description: array of prices for options and greeks
      type: array
      items:
        type: object
        properties:
          Snapshot_time_(GMT):
            type: string
            format: date-time
          Eurex_code:
            type: string
          Maturity:
            type: string
          Option type:
            type: string
          Exercise:
            type: string
          StrikePrice:
            type: number
          Calibrated price:
            type: number
          Canari Price:
            type: number
          Calibrated Implied Vol:
            type: number
          Delta:
            type: number
          Vega:
            type: number
          Forward:
            type: number
          MDE:
            type: number
          DIV:
            type: number
          CSA:
            type: number
          SMI:
            type: number
          Underlying_full_name:
            type: string
      example: >
        Snapshot_time_(GMT),Eurex code,Maturity,Option type,Exercise,StrikePrice,Calibrated price,Canari Price,Calibrated Implied Vol,Delta,Vega,Forward,MDE,DIV,CSA,SMI,Underlying_full_name
        
