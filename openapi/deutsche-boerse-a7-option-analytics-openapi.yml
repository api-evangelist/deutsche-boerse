  /aidataset/OPT/{symbol}:
    get:
      tags:
        - Option Prices and Greeks
      summary: gets live options prices
      description: >
        live (delayed) prices for options on European stocks and indices including:<br/>
          * reference spot price, bid/ask screen price, fair value price (based on surface calibration), implicit volatility, forward<br/>
          * greeks : delta, vega<br/>
        
        Canari.dev computes AI-generated forecast signals indicating which option is over/underpriced, based on the holders strategy (buy and hold until maturity, 1 hour to 2 days holding horizon...). From these signals is derived a "Canari price" which is also available in this live tables.<br/>
        The delay ranges from 15 to 40 minutes depending on underlyings.
      operationId: getOPT
      parameters:
        - $ref: '#/components/parameters/symbol'
      responses:
        200:
          description: successful operation
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/prices'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
