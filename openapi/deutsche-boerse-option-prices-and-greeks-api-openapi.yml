openapi: 3.2.0
info:
  title: A7 Analytics Platform - Option Analytics Option Prices and…
  description: A7 Analytics Platform for the main T7 trading venues of Deutsche Börse Group.
  contact:
    name: Deutsche Börse Data & Analytics
    url: https://www.mds.deutsche-boerse.com
    email: analytics@deutsche-boerse.com
  version: 1.0.1
servers:
- url: /api/v1
  description: A7 production environment
security:
- bearerAuth: []
tags:
- name: Option Prices and Greeks
paths:
  /aidataset/OPT/{symbol}:
    get:
      tags:
      - Option Prices and Greeks
      summary: gets live options prices
      description: 'live (delayed) prices for options on European stocks and indices including:


        * reference spot price, bid/ask screen price, fair value price (based on surface calibration), implicit volatility, forward


        * greeks : delta, vega


        Canari.dev computes AI-generated forecast signals indicating which option is over/underpriced, based on the holders strategy (buy and hold until maturity, 1 hour to 2 days holding horizon...). From these signals is derived a "Canari price" which is also available in this live tables.

        The delay ranges from 15 to 40 minutes depending on underlyings.'
      operationId: getOPT
      parameters:
      - $ref: '#/components/parameters/symbol'
      responses:
        200:
          description: successful operation
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/prices'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
  /aidataset/OPT/{symbol}/{maturity}:
    get:
      tags:
      - Option Prices and Greeks
      summary: gets live options prices for a given maturity
      description: 'live (delayed) prices for options on European stocks and indices including:


        * reference spot price, bid/ask screen price, fair value price (based on surface calibration), implicit volatility, forward


        * greeks : delta, vega


        Canari.dev computes AI-generated forecast signals indicating which option is over/underpriced, based on the holders strategy (buy and hold until maturity, 1 hour to 2 days holding horizon...). From these signals is derived a "Canari price" which is also available in this live tables.

        The delay ranges from 15 to 40 minutes depending on underlyings.'
      operationId: getOPTmat
      parameters:
      - $ref: '#/components/parameters/symbol'
      - $ref: '#/components/parameters/maturity'
      responses:
        200:
          description: successful operation
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/prices'
            application/gzip:
              schema:
                $ref: '#/components/schemas/prices'
                format: binary
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
components:
  responses:
    '404':
      description: not found
    '403':
      description: access denied
      content:
        text/plain:
          schema:
            type: string
          example: specific error message
    '400':
      description: bad request
      content:
        text/plain:
          schema:
            type: string
          example: specific error message
    '401':
      description: authorization failed
      content:
        text/plain:
          schema:
            type: string
          example: specific error message
  parameters:
    symbol:
      name: symbol
      in: path
      description: unique trading symbol identifier
      required: true
      schema:
        $ref: '#/components/schemas/symbol'
    maturity:
      name: maturity
      in: path
      description: option maturity
      required: true
      schema:
        $ref: '#/components/schemas/maturity'
  schemas:
    symbol:
      description: trading symbol
      type: string
      enum:
      - OESX
      - ODAX
      - OSMI
      - OESB
      - OVS2
      - ITK
      - ABBN
      - ASM
      - ADS
      - AIR
      - EAD
      - ALV
      - AXA
      - BAS
      - BBVD
      - BMW
      - BNP
      - BAY
      - DBK
      - DB1
      - DPW
      - DTE
      - EOA
      - ENL5
      - INN
      - IBE
      - IFX
      - IES5
      - PPX
      - LOR
      - MOH
      - LIN
      - DAI
      - MUV2
      - NESN
      - NOVN
      - PHI1
      - REP
      - ROG
      - SAP
      - SNW
      - BSD2
      - SND
      - SIE
      - SGE
      - SREN
      - TNE5
      - TOTB
      - UBSN
      - CRI5
      - SQU
      - VO3
      - ANN
      - ZURN
      example: DB1
    maturity:
      description: option maturity
      type: string
      pattern: ^[01][0-9]{3}$
      example: '0625'
    prices:
      description: array of prices for options and greeks
      type: array
      items:
        type: object
        properties:
          Snapshot_time_(GMT):
            type: string
            format: date-time
          Eurex_code:
            type: string
          Maturity:
            type: string
          Option type:
            type: string
          Exercise:
            type: string
          StrikePrice:
            type: number
          Calibrated price:
            type: number
          Canari Price:
            type: number
          Calibrated Implied Vol:
            type: number
          Delta:
            type: number
          Vega:
            type: number
          Forward:
            type: number
          MDE:
            type: number
          DIV:
            type: number
          CSA:
            type: number
          SMI:
            type: number
          Underlying_full_name:
            type: string
      example: 'Snapshot_time_(GMT),Eurex code,Maturity,Option type,Exercise,StrikePrice,Calibrated price,Canari Price,Calibrated Implied Vol,Delta,Vega,Forward,MDE,DIV,CSA,SMI,Underlying_full_name

