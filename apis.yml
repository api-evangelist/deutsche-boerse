aid: deutsche-boerse
url: https://raw.githubusercontent.com/api-evangelist/deutsche-boerse/refs/heads/main/apis.yml
name: Deutsche Börse
kind: company
description: Deutsche Börse AG is the Frankfurt-based, publicly listed (FWB DB1) exchange
  organization behind the Frankfurt Stock Exchange and Xetra cash market, the Eurex
  derivatives exchange, EEX, 360T, Clearstream post-trade services, and the ISS STOXX
  index and analytics business. Its Market Data + Services arm sells real-time, historical,
  and reference market data, delivered through a self-serve Group API platform (developer.deutsche-boerse.com,
  API-key gated REST and GraphQL), the A7 Analytics Platform cloud REST API for nanosecond
  order-by-order Eurex/Xetra/EEX/CME history, a Cloud Stream WebSocket feed, licensed
  low-latency feeds, and the Datashop for commercial data purchases.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
